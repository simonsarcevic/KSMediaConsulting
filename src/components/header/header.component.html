<header [class.compact]="compact()">
  <a class="brand" href="#start" aria-label="KS Media Consulting – Startseite"
    ><img src="/assets/brand/ks-logo-horizontal.svg" alt="KS Media Consulting"
  /></a>
  <button
    class="menu-toggle"
    type="button"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="main-navigation"
    [attr.aria-label]="menuOpen() ? 'Menü schließen' : 'Menü öffnen'"
  >
    <span></span><span></span>
  </button>
  <nav id="main-navigation" [class.open]="menuOpen()" aria-label="Hauptnavigation">
    <a href="#leistungen" (click)="closeMenu()">Leistungen</a
    ><a href="#ueber-uns" (click)="closeMenu()">Über uns</a
    ><a href="#prozess" (click)="closeMenu()">Prozess</a>
    <button class="nav-cta" type="button" (click)="contactClick.emit(); closeMenu()">
      Projekt anfragen <span>↗</span>
    </button>
  </nav>
</header>
